<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>AfterShow — Stream films & series</title>
    <meta name="description" content="Discover films and browse Tamil and dubbed series by season and episode on AfterShow." />
    <script>
      try {
        var savedTheme = localStorage.getItem('aftershow-theme') || localStorage.getItem('afterframe-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/player.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/video.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip">Skip to content</a>

    <!-- Left icon rail -->
    <aside class="rail" aria-label="Navigation">
      <a class="rail-brand" href="/" aria-label="AfterShow home">
        <svg viewBox="0 0 28 28" width="28" height="28" fill="none">
          <defs>
            <linearGradient id="as-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff6b3d"/>
              <stop offset="100%" stop-color="#ff3366"/>
            </linearGradient>
          </defs>
          <rect x="2" y="3.5" width="24" height="21" rx="6" fill="url(#as-logo-grad)" fill-opacity="0.22" stroke="url(#as-logo-grad)" stroke-width="2"/>
          <circle cx="7" cy="8" r="1.5" fill="#ff6b3d"/>
          <circle cx="21" cy="8" r="1.5" fill="#ff3366"/>
          <circle cx="7" cy="20" r="1.5" fill="#ff6b3d"/>
          <circle cx="21" cy="20" r="1.5" fill="#ff3366"/>
          <path d="M12 9.5l7 4.5-7 4.5v-9z" fill="url(#as-logo-grad)"/>
        </svg>
      </a>
      <nav class="rail-nav" aria-label="Main navigation">
        <a id="discover-nav" href="/" class="rail-link" title="Discover" aria-label="Discover">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span>Discover</span>
        </a>
        <a id="browse-nav" href="/movies" class="rail-link" title="Browse" aria-label="Browse movies">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="17"/><line x1="9.5" y1="14.5" x2="14.5" y2="14.5"/></svg>
          <span>Movies</span>
        </a>
        <a id="series-nav" href="/series" class="rail-link" title="Series" aria-label="Browse series">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          <span>Series</span>
        </a>
        <a href="/search" id="search-nav" class="rail-link" title="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span>Search</span>
        </a>
      </nav>
      <button id="theme" class="rail-link rail-theme" aria-label="Toggle theme" title="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
        </svg>
        <span>Theme</span>
      </button>
    </aside>

    <!-- Top search bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <form role="search" class="search-form" action="/search">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input
            name="q"
            id="query"
            type="search"
            maxlength="120"
            placeholder="Search films, series…"
            aria-label="Search films"
            aria-controls="suggestions"
            autocomplete="off"
            required
          />
          <kbd class="search-kbd">/</kbd>
          <div id="suggestions" class="suggestions" hidden role="listbox" aria-label="Search suggestions"></div>
        </form>
      </div>
    </header>

    <!-- Main content -->
    <main id="main" class="shell" tabindex="-1"></main>

    <noscript>Enable JavaScript to browse the film catalogue.</noscript>

    <footer class="foot">
      <p class="foot-copy">© AfterShow — Free Film & Series Journal</p>
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
