<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111827" />
    <title>AfterShow — Stream films & series</title>
    <meta name="description" content="Discover films and browse Tamil and dubbed series by season and episode on AfterShow." />
    <meta name="google-site-verification" content="IXn12EwJDgcVhcnxkgmrmHP-3b-oNAnIM1mbk1Fu1i4" />
    <script>
      try {
        var savedTheme = localStorage.getItem('aftershow-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
          if (savedTheme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f5f7fa';
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/style.css?v=theme-tokens" />
    <link rel="stylesheet" href="/player.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/video.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
    <script type="module" src="/app.js"></script>
    <!-- web analytics -->
  </head>
  <body>
    <a href="#main" class="skip">Skip to content</a>

    <header class="topbar">
      <div class="topbar-inner">
      <a class="wordmark" href="/" aria-label="AfterShow home"><img src="/icon.svg" width="32" height="32" alt="" /> <span>After<b>Show</b></span></a>
      <nav class="site-tabs" aria-label="Main navigation">
        <a id="discover-nav" href="/" class="site-tab" title="Discover" aria-label="Discover">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span>Discover</span>
        </a>
        <a id="browse-nav" href="/movies" class="site-tab" title="Browse" aria-label="Browse movies">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16m10-16v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg>
          <span>Movies</span>
        </a>
        <a id="series-nav" href="/series" class="site-tab" title="Series" aria-label="Browse series">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          <span>Series</span>
        </a>
        <a href="/search" id="search-nav" class="site-tab" title="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span>Search</span>
        </a>
      </nav>
        <form role="search" class="search-form" action="/search">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input
            name="q"
            id="query"
            type="search"
            maxlength="120"
            placeholder="Search films, series…"
            aria-label="Search films"
            aria-controls="suggestions"
            autocomplete="off"
            enterkeyhint="search"
            required
          />
          <kbd class="search-kbd">/</kbd>
          <div id="suggestions" class="suggestions" hidden role="group" aria-label="Search suggestions"></div>
        </form>
        <button type="button" id="theme" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main id="main" class="shell" tabindex="-1"></main>

    <noscript>Enable JavaScript to browse the film catalogue.</noscript>

    <footer class="foot">
      <p class="foot-copy">© AfterShow — Free Film & Series Journal</p>
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
